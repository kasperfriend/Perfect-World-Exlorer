name: PR checks and Windows build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Rust checks and tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify recovered regional arithmetic on x87
        run: |
          cc -O0 tools/check-native-region-reference.c -o /tmp/native-region-reference
          /tmp/native-region-reference
      - name: Test requirement status audits
        run: |
          python3 tools/test_phase1_ready.py
          python3 tools/test_eight_phase_status.py
          python3 tools/check-eight-phase-status.py
          python3 tools/audit-static-model-gpu-programs.py
          rustc --edition=2021 --test src/scenery_visibility.rs -o /tmp/scenery-visibility-tests
          /tmp/scenery-visibility-tests
          # Graphics upscaling / frame-generation support matrix and the
          # independent-selector policy: pure arithmetic, no GPU needed.
          rustc --edition=2021 --test src/upscaling.rs -o /tmp/upscaling-tests
          /tmp/upscaling-tests
          # Phase 5 sky-swap machine: standalone, so a failure names the recovered
          # count grid, the commit boundaries or the never-retarget guard directly
          # instead of only failing the viewer's test binary (P5.07).
          rustc --edition=2021 --test src/sky_transition.rs -o /tmp/sky-transition-tests
          /tmp/sky-transition-tests
          # Phase 5 sky panorama seam (P5.09): the two meridian bands of the
          # production `sky_gpu::sky` mapping, the layer-index group integrity and
          # both sides of a meridian, as pure arithmetic with no GPU and no assets.
          rustc --edition=2021 -O -o /tmp/phase5-sky-seam-check src/bin/phase5-sky-seam-check.rs
          /tmp/phase5-sky-seam-check
      - name: Check all binary targets
        run: |
          # Keep the plain command so a non-zero exit still fails the job, but
          # also re-echo the compiler diagnostics as check annotations: the raw
          # step log is not always retrievable from the API.
          CARGO_TERM_COLOR=never cargo check --locked --bins --message-format short 2>&1 | tee /tmp/cargo-check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "(^error|: error)" /tmp/cargo-check.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"
      - name: Test GFX light dependency audit
        run: cargo test --locked --bin gfx-light-audit
      - name: Run viewer unit tests
        run: |
          CARGO_TERM_COLOR=never cargo test --locked --bin perfect-world-explorer 2>&1 | tee /tmp/cargo-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "(^error|: error|panicked at|assertion)" /tmp/cargo-test.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"
      - name: Install software Vulkan for Phase 1 shader checks
        run: sudo apt-get install -y mesa-vulkan-drivers
      - name: Run Phase 1 production shader regressions
        env:
          WGPU_BACKEND: vulkan
          XDG_RUNTIME_DIR: /tmp
        run: |
          # Mesa renamed this file on newer Ubuntu images. Resolve the installed
          # lavapipe ICD rather than silently disabling Vulkan with a stale path.
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          cargo run --locked --bin display-gamma-gpu-check
          cargo run --locked --bin post-gpu-check
          cargo run --locked --bin bloom-gpu-check
          cargo run --locked --bin bmd-baked-gpu-check
          cargo run --locked --bin bmd-sided-gpu-check
          cargo run --locked --bin bmd-depth-gpu-check
          cargo run --locked --bin scenery-pass-gpu-check
          cargo run --locked --bin grass-instance-gpu-check
          cargo run --locked --bin model-light-gpu-check
          cargo run --locked --bin skin-pose-gpu-check
          cargo run --locked --bin skin-palette-gpu-check
          cargo run --locked --bin model-texture-gpu-check
          cargo run --locked --bin model-receiver-gpu-check
          cargo run --locked --bin model-draw-gpu-check
          cargo run --locked --bin phase1-fog-gpu-check
          # Phase 5: native sky resource swap (`0x4203f4..0x420807` / `0x79aeb0`)
          # plus reflection and altitude invariants (P5.07, P5.08). Compiles the
          # production sky WGSL, proves the two-set crossfade changes pixels,
          # proves camera altitude cannot move a sky ray, and proves every view
          # reuses one snapshot without advancing the transition.
          cargo run --locked --bin phase5-sky-transition-gpu-check
          cargo run --locked --bin terrain-refraction-gpu-check
          cargo run --locked --bin water-fog-gpu-check
          # Near/far LOD continuity: runs both real terrain vertex entry points
          # (`vs`, `vs_far`) on identical geometry and compares the interpolated
          # normal in RGB plus the packed LOD flag in alpha.
          cargo run --locked --bin terrain-lod-gpu-check
          # Phase 4 vegetation diagnostics: tree LOD/lighting preservation,
          # grass mip coverage/upload, and synthetic authored tree mip upload.
          cargo run --locked --bin tree-lod-gpu-check
          cargo run --locked --bin grass-gpu-mip-check
          cargo run --locked --bin tree-authored-mip-gpu-check
      - name: Run terrain per-view GPU check
        env:
          WGPU_BACKEND: vulkan
          XDG_RUNTIME_DIR: /tmp
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          cargo run --locked --bin terrain-view-gpu-check

  windows:
    name: Windows executable (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc
      - name: Rebuild the embedded 32-bit SpeedTree bridge
        shell: msys2 {0}
        run: g++ -static -O2 -municode tools/speedtree/bake.cpp -o tools/speedtree/speedtree-bake.exe
      - uses: Swatinem/rust-cache@v2
      - name: Capture gamma words with native x86 MSVCRT exports
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "MSVC x86 tools not found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars32.bat"
          $exe = Join-Path $env:RUNNER_TEMP "native-gamma.exe"
          $prefix = Join-Path $env:RUNNER_TEMP "native-gamma"
          $command = "call `"$vcvars`" && cl /nologo /W4 /O2 tools\capture-native-gamma-x87.c /Fe:`"$exe`" && `"$exe`" `"$prefix`""
          cmd /d /s /c $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: NativeGammaX87Words
          path: ${{ runner.temp }}/native-gamma-pc*.bin
          if-no-files-found: error
      - name: Compare production gamma with independent x86 MSVCRT words
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "compare-gamma-words.exe"
          rustc --edition=2021 tools/check-native-gamma-words.rs -o $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe (Join-Path $env:RUNNER_TEMP "native-gamma-pc24.bin")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native gamma and glow CPU references on Windows
        shell: pwsh
        run: |
          # Keep CPU references for both the P4 vegetation material policy and
          # the P5 sky-swap machine in the Windows-native verification set.
          foreach ($module in @("gamma_curve", "glow_state", "post_plan", "color_chain", "fog_matrix", "client_region_shade", "client_region_stream", "client_regional_light", "gfx_color_track", "vegetation_material", "sky_transition")) {
            $exe = Join-Path $env:RUNNER_TEMP "$module-tests.exe"
            rustc --edition=2021 --test "src/$module.rs" -o $exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build standalone viewer
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin perfect-world-explorer
      - name: Stage the distributable folder and checksums
        shell: pwsh
        run: |
          # Downloading the artifact yields a zip whose top level is this folder,
          # not a pile of loose files. The BMD overlap survey is a development
          # diagnostic and is deliberately NOT built or shipped here.
          $folder = Join-Path "artifact" "Perfect-World-Explorer"
          New-Item -ItemType Directory -Force -Path (Join-Path $folder "docs") | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/perfect-world-explorer.exe (Join-Path $folder "Perfect-World-Explorer.exe")
          Copy-Item README.md (Join-Path $folder "README.md")
          Copy-Item LICENSE (Join-Path $folder "LICENSE")
          Copy-Item docs/Graphics-Upscaling.md (Join-Path $folder "docs/Graphics-Upscaling.md")
          $shipped = @("Perfect-World-Explorer.exe", "README.md", "LICENSE", "docs/Graphics-Upscaling.md")
          $lines = foreach ($rel in $shipped) {
            $hash = (Get-FileHash (Join-Path $folder $rel) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $rel"
          }
          $lines | Out-File -Encoding ascii (Join-Path $folder "SHA256SUMS.txt")
          $survey = Get-ChildItem -Recurse -File $folder | Where-Object { $_.Name -match 'Bmd.*Survey\.exe$' }
          if ($survey) { throw "BmdOverlapSurvey.exe must not be shipped" }
          Get-ChildItem -Recurse -File $folder | ForEach-Object { $_.FullName }
      - uses: actions/upload-artifact@v4
        with:
          name: Perfect-World-Explorer-Windows-x64
          # artifact/ is the parent, so the zip contains the
          # Perfect-World-Explorer/ folder with the exe and companion files.
          path: artifact/
          if-no-files-found: error
          retention-days: 14
