name: CI diagnostics (temporary, remove before merge)

on:
  push:
    branches: [arena/f61c0c9b-perfect-world-exlorer]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  diagnose:
    name: Diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev mesa-vulkan-drivers
      - name: Collect diagnostics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "## cargo fmt --check"
            cargo fmt --all -- --check
            echo "fmt-exit=$?"
            echo "## rustfmt diff (applied in the runner only)"
            cargo fmt --all
            git --no-pager diff
            echo "## cargo check --bins"
            cargo check --locked --bins > /tmp/check.txt 2>&1
            echo "check-exit=$?"
            grep -n "^error\|error\[" -A 10 /tmp/check.txt | head -140
            echo "## check tail"
            tail -30 /tmp/check.txt
            echo "## unit tests"
            cargo test --locked --bin perfect-world-explorer 2>&1 | tail -120
            echo "## gpu checks"
            export WGPU_BACKEND=vulkan XDG_RUNTIME_DIR=/tmp
            VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
            export VK_ICD_FILENAMES
            echo "icd=$VK_ICD_FILENAMES"
            for target in display-gamma-gpu-check post-gpu-check bloom-gpu-check bmd-baked-gpu-check grass-instance-gpu-check model-light-gpu-check skin-pose-gpu-check skin-palette-gpu-check model-texture-gpu-check model-receiver-gpu-check model-draw-gpu-check phase1-fog-gpu-check terrain-refraction-gpu-check; do
              echo "--- $target"
              timeout 300 cargo run --quiet --locked --bin "$target" > "/tmp/$target.log" 2>&1
              echo "$target exit=$?"
              tail -12 "/tmp/$target.log"
            done
            echo "## dependency-free modules"
            for module in post_plan color_chain fog_matrix glow_state view_settings; do
              echo "--- $module"
              rustc --edition=2021 --test "src/$module.rs" -o "/tmp/$module" 2>&1 | head -40
              "/tmp/$module" 2>&1 | grep -E "FAILED|failures:|panicked|test result|assert" -A 4 | head -40
            done
          } > /tmp/diag.txt 2>&1
          head -c 60000 /tmp/diag.txt > /tmp/diag_trim.txt
          gh pr comment 4 --body-file /tmp/diag_trim.txt
