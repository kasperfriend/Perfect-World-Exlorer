name: CI diagnostics (temporary)

# Temporary, review-only workflow. GitHub serves job logs from a host this
# environment cannot reach, so this job republishes the compiler and test output
# as a PR comment, which the session can read. It builds nothing that is
# shipped and is deleted before handoff.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Collect output
        run: |
          set +e
          {
            echo "### fmt"
            cargo fmt --all -- --check 2>&1 | head -200
            echo "### check"
            cargo check --locked --bins --message-format short 2>&1 | grep -E "^(src|error|warning)" | head -80
            echo "### tests"
            cargo test --locked --bin perfect-world-explorer 2>&1 | grep -E "^test " | grep -c "ok$" | sed 's/^/passing: /'
            cargo test --locked --bin perfect-world-explorer 2>&1 | sed -n '/^failures:$/,$p' | head -140
          } > /tmp/diag.txt 2>&1
          tail -c 20000 /tmp/diag.txt
      - name: Install software Vulkan
        run: sudo apt-get install -y mesa-vulkan-drivers
      - name: GPU regressions
        env:
          WGPU_BACKEND: vulkan
          XDG_RUNTIME_DIR: /tmp
        run: |
          set +e
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          {
            echo "### gpu"
            for b in display-gamma-gpu-check post-gpu-check bloom-gpu-check bmd-baked-gpu-check grass-instance-gpu-check model-light-gpu-check skin-pose-gpu-check skin-palette-gpu-check model-texture-gpu-check model-receiver-gpu-check model-draw-gpu-check phase1-fog-gpu-check terrain-refraction-gpu-check; do
              out=$(cargo run --locked --bin "$b" 2>&1)
              if [ $? -eq 0 ]; then echo "$b: ok"; else echo "$b: FAILED"; echo "$out" | tail -25; fi
            done
          } >> /tmp/diag.txt 2>&1
          tail -60 /tmp/diag.txt
      - name: Apply rustfmt
        run: |
          set +e
          cargo fmt --all
          git config user.name "ci-format"
          git config user.email "noreply@example.invalid"
          git add -A
          git diff --cached --quiet || git commit -q -m "Apply rustfmt (temporary diagnostics workflow)"
          git push origin HEAD:${{ github.head_ref }} || echo "format push failed"
      - name: Publish comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          n=${{ github.event.pull_request.number }}
          [ -n "$n" ] || exit 0
          { echo '<!-- ci-diagnostics -->'; echo "Run ${{ github.run_id }}"; echo '```'; cat /tmp/diag.txt; echo '```'; } > /tmp/body.md
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/issues/${n}/comments" --paginate --jq '.[] | select(.body | startswith("<!-- ci-diagnostics -->")) | .id'); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" || true
          done
          gh api "repos/${GITHUB_REPOSITORY}/issues/${n}/comments" -F body=@/tmp/body.md >/dev/null
