name: ci-diagnostics

on:
  push:
    branches: ['arena/f61c0c9b-perfect-world-exlorer']

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: cargo check output
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev
      - name: Check all binary targets
        run: |
          set +e
          cargo check --locked --bins > /tmp/check.txt 2>&1
          echo "exit=$?" >> /tmp/check.txt
          { echo 'cargo check output:'; echo '```'; head -c 50000 /tmp/check.txt; echo '```'; } > /tmp/report.md
          tail -c 2000 /tmp/check.txt
      - name: Post the output as a PR comment
        if: always()
        run: gh pr comment 4 --body-file /tmp/report.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
