name: ci-diagnostics

on:
  push:
    branches: ['arena/f61c0c9b-perfect-world-exlorer']

permissions:
  contents: read
  pull-requests: write

jobs:
  water:
    name: water fog check output
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev mesa-vulkan-drivers
      - name: Run the water fog check
        env:
          WGPU_BACKEND: vulkan
          XDG_RUNTIME_DIR: /tmp
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          set +e
          cargo run --locked --bin water-fog-gpu-check > /tmp/water.txt 2>&1
          echo "exit=$?" >> /tmp/water.txt
          { echo 'water-fog-gpu-check output:'; echo '```'; tail -c 40000 /tmp/water.txt; echo '```'; } > /tmp/report.md
          tail -c 2000 /tmp/water.txt
      - name: Post the output as a PR comment
        if: always()
        run: gh pr comment 4 --body-file /tmp/report.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
