name: Effects asset recovery and census

on:
  workflow_dispatch:
  push:
    branches:
      - effects/restore-native-world-effects
    paths:
      - ".github/effects-assets-trigger.txt"

permissions:
  contents: read
  actions: write

concurrency:
  group: effects-asset-recovery
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PW_SHARED_FOLDER_URL: ${ secrets.PW_SHARED_FOLDER_URL }
    steps:
      - name: Check out the effects branch
        uses: actions/checkout@v4
        with:
          ref: ${ github.ref }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify secret is configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$PW_SHARED_FOLDER_URL" ]; then
            echo "::error::Repository Actions secret PW_SHARED_FOLDER_URL is missing."
            exit 1
          fi
          echo "Dropbox link secret is configured (URL withheld)."

      - name: Download the shared Dropbox folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw-source /tmp/pw-work
          python - <<'PY'
          import os
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          source = os.environ["PW_SHARED_FOLDER_URL"]
          parts = urlsplit(source)
          if parts.scheme != "https" or parts.hostname not in ("www.dropbox.com", "dropbox.com"):
              raise SystemExit("PW_SHARED_FOLDER_URL must be an https Dropbox shared-folder URL.")
          query = dict(parse_qsl(parts.query, keep_blank_values=True))
          query["dl"] = "1"
          target = urlunsplit((parts.scheme, parts.netloc, parts.path, urlencode(query), ""))
          with open("/tmp/pw-download-url", "w", encoding="utf-8") as f:
              f.write(target)
          PY
          echo "Requesting the Dropbox folder ZIP (the URL is not written to logs)."
          if ! curl --fail --location --silent --show-error \
              --retry 4 --retry-all-errors --retry-delay 10 \
              --connect-timeout 30 --max-time 5400 \
              --output /tmp/pw-source.zip \
              "$(cat /tmp/pw-download-url)"; then
            echo "::error::Dropbox folder download failed. Check that the link is public, view-only, and allows downloads."
            exit 1
          fi
          rm -f /tmp/pw-download-url
          python - <<'PY'
          import os, zipfile
          p = "/tmp/pw-source.zip"
          size = os.path.getsize(p)
          print(f"Downloaded folder archive: {size:,} bytes")
          if size < 1_000_000 or not zipfile.is_zipfile(p):
              raise SystemExit("Dropbox did not return a valid folder ZIP.")
          with zipfile.ZipFile(p) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC failure in {bad}")
              print(f"ZIP members: {len(z.infolist()):,}")
          PY
          unzip -q /tmp/pw-source.zip -d /tmp/pw-source
          rm -f /tmp/pw-source.zip
          echo "Extracted Dropbox folder to the temporary runner disk."

      - name: Locate and verify client archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Findings/effects-archive-census
          find /tmp/pw-source -type f -printf '%p\t%s\n' | sort \
            > Findings/effects-archive-census/downloaded-files.tsv
          for name in gfx.pck models.pck litmodels.pck textures.pck shaders.pck maps.zip; do
            matches=$(find /tmp/pw-source -type f -name "$name" -print)
            if [ -z "$matches" ]; then
              echo "::error::Required archive $name was not found in the shared folder."
              exit 1
            fi
            count=$(printf '%s\n' "$matches" | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "::error::Expected one $name, found $count."
              exit 1
            fi
          done
          find /tmp/pw-source -type f \( -name '*.pck' -o -name 'maps.zip' \) -print0 \
            | sort -z | xargs -0 sha256sum \
            > Findings/effects-archive-census/archive-sha256.txt
          find /tmp/pw-source -type f -name gfx.pck -print -quit \
            | xargs -r dirname > /tmp/pw-client-dir
          CLIENT_DIR=$(cat /tmp/pw-client-dir)
          echo "CLIENT_DIR=$CLIENT_DIR" >> "$GITHUB_ENV"
          echo "Required archives found; hashes recorded."

      - name: Census retail PCK roots and ECM effect references
        shell: bash
        run: |
          set -euo pipefail
          python tools/effects-archive-census.py \
            --client-dir "$CLIENT_DIR" \
            --out-dir Findings/effects-archive-census \
            | tee Findings/effects-archive-census/effects-census-summary.txt

      - name: Census all members in retail PCK archives
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p Findings/effects-archive-census/member-censuses
          for name in gfx models litmodels textures grasses facedata; do
            pack="$CLIENT_DIR/$name.pck"
            [ -f "$pack" ] || continue
            echo "=== $name.pck ==="
            if python tools/archive-census.py "$pack" \
                --json "Findings/effects-archive-census/member-censuses/$name.json" \
                --list-unsupported \
                > "Findings/effects-archive-census/member-censuses/$name.txt" 2>&1; then
              echo "$name.pck census complete."
            else
              echo "$name.pck: retail PCK census did not accept this container; see its report."
            fi
          done
          exit 0

      - name: Census Angelica package archives
        shell: bash
        run: |
          set -uo pipefail
          for name in configs shaders textures; do
            pack="$CLIENT_DIR/$name.pck"
            [ -f "$pack" ] || continue
            if python tools/extract-angelic-pck.py "$pack" --list \
                > "Findings/effects-archive-census/$name-angelic-list.txt" \
                2> "Findings/effects-archive-census/$name-angelic-errors.txt"; then
              echo "$name.pck Angelica listing complete."
            else
              echo "$name.pck is not accepted by the Angelica reader; diagnostic saved."
            fi
          done
          exit 0

      - name: Inspect world-map archive index
        shell: bash
        run: |
          set -euo pipefail
          MAPS=$(find /tmp/pw-source -type f -name maps.zip -print -quit)
          python - "$MAPS" "Findings/effects-archive-census/maps-zip-index.csv" \
            "Findings/effects-archive-census/maps-zip-summary.txt" <<'PY'
          import csv, pathlib, sys, zipfile
          archive, csv_path, summary_path = sys.argv[1:]
          with zipfile.ZipFile(archive) as z:
              infos = z.infolist()
              with open(csv_path, "w", encoding="utf-8-sig", newline="") as f:
                  w = csv.writer(f)
                  w.writerow(["path", "compressed_bytes", "uncompressed_bytes", "interesting"])
                  for i in infos:
                      n = i.filename.replace("\\", "/")
                      interesting = n.lower().endswith((".ecwld", ".ecbsd")) or \
                                    "/bsdata/" in n.lower() or n.lower().endswith(".dat")
                      w.writerow([n, i.compress_size, i.file_size, int(interesting)])
              selected = [i for i in infos if
                          i.filename.lower().endswith((".ecwld", ".ecbsd")) or
                          "/bsdata/" in i.filename.lower()]
              lines = [
                  f"archive={pathlib.Path(archive).name}",
                  f"members={len(infos)}",
                  f"total_uncompressed_bytes={sum(i.file_size for i in infos)}",
                  f"ecwld_count={sum(i.filename.lower().endswith('.ecwld') for i in infos)}",
                  f"ecbsd_count={sum(i.filename.lower().endswith('.ecbsd') for i in infos)}",
                  f"bsdata_or_world_file_count={len(selected)}",
                  "",
                  "Relevant members:"
              ]
              lines.extend(f"{i.file_size:12d}  {i.filename}" for i in selected)
              pathlib.Path(summary_path).write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(pathlib.Path(summary_path).read_text(encoding="utf-8"))
          PY

      - name: Publish metadata-only census report
        uses: actions/upload-artifact@v4
        with:
          name: effects-archive-census
          path: Findings/effects-archive-census/
          if-no-files-found: error
          retention-days: 7
