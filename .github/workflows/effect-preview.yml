name: Effect previews

# Render the shipped effect roots headlessly and keep the frames.
#
# `src/effect_preview.rs` builds the viewer's own `World`, installs one authored
# placement, ticks the real frame loop and renders the real effect pass into an
# offscreen texture. It needs the retail `gfx.pck` (the roots and their
# textures) and an `.ecwld` (which placements the map authors), neither of which
# is in the repository, so this job fetches them on a runner and runs the
# `#[ignore]`d corpus test. `effect_preview_smoke` runs in `pr-checks.yml`
# instead: it authors its own root and needs no client file.
#
# Manual only. Every run uploads `target/effect-preview/*.png` plus the log that
# carries the measured box of each effect, which is what says whether a sheet
# was drawn at the size its root authored, and commits both to
# `Findings/effect-preview/` so a reviewer reads them without an artifact
# download.

on:
  # `workflow_dispatch` cannot start a workflow that is not yet on the default
  # branch, so a push to this one file is the "run it now" switch used while the
  # workflow itself is still under review.
  push:
    paths:
      - ".github/effect-preview-trigger.txt"
  workflow_dispatch:
    inputs:
      roots:
        description: "; separated substrings of the effect paths to render (empty renders everything)"
        required: false
        default: "水门_瀑布;树林光束;圣城之光"
      limit:
        description: "how many placements to render"
        required: false
        default: "6"
      frames:
        description: "comma separated shot times, in milliseconds"
        required: false
        default: "0,300,900"
      size:
        description: "PNG edge in pixels"
        required: false
        default: "384"
      gfx_id:
        description: "Drive id of the gfx.pck to render"
        required: false
        default: "1a_q8Xew2gDY5hlLcKxcuFnmkP_2gsfAH"
      world_id:
        description: "Drive id of the world.ecwld to take placements from"
        required: false
        default: "1nYOesKLxtlHD6fy1M_hqBSRSNBiTLd8I"

permissions:
  contents: write

concurrency:
  group: effect-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Render the effect roots
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update || sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            mesa-vulkan-drivers || \
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            mesa-vulkan-drivers

      - name: Download the client effect archive
        env:
          GFX_ID: ${{ inputs.gfx_id || '1a_q8Xew2gDY5hlLcKxcuFnmkP_2gsfAH' }}
          WORLD_ID: ${{ inputs.world_id || '1nYOesKLxtlHD6fy1M_hqBSRSNBiTLd8I' }}
        run: |
          set -euo pipefail
          mkdir -p client
          fetch() {
            curl -fsSL --retry 3 --retry-delay 5 -o "client/$2" \
              "https://drive.usercontent.google.com/download?id=$1&export=download&confirm=t"
            size=$(stat -c%s "client/$2")
            echo "client/$2: $size bytes"
            if [ "$size" -lt 1000 ]; then
              echo "::error::client/$2 is only $size bytes - the Drive download returned a page, not the file"
              head -c 400 "client/$2" || true
              exit 1
            fi
          }
          fetch "$GFX_ID" gfx.pck
          fetch "$WORLD_ID" world.ecwld

      - name: Render
        env:
          WGPU_BACKEND: vulkan
          XDG_RUNTIME_DIR: /tmp
          PWE_PREVIEW_ELEMENT: client
          PWE_PREVIEW_WORLD: client/world.ecwld
          PWE_PREVIEW_ROOTS: ${{ inputs.roots || '水门_瀑布;圣城之光;树林光束' }}
          PWE_PREVIEW_MAX: ${{ inputs.limit || '6' }}
          PWE_PREVIEW_FRAMES: ${{ inputs.frames || '0,300,900' }}
          PWE_PREVIEW_SIZE: ${{ inputs.size || '384' }}
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          if [ -z "$VK_ICD_FILENAMES" ]; then
            echo "::error::no lavapipe ICD; nothing rendered"
            exit 1
          fi
          mkdir -p target/effect-preview
          CARGO_TERM_COLOR=never cargo test --locked --bin perfect-world-explorer \
            -- --ignored --nocapture effect_previews \
            2>&1 | tee target/effect-preview/render.log
          status=${PIPESTATUS[0]}
          grep -E "^preview:" target/effect-preview/render.log || true
          if [ "$status" -ne 0 ]; then
            echo "::error::the effect preview run failed"
            grep -A3 -E "panicked at" target/effect-preview/render.log \
              | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      # The frames and the log line that measures each effect are the evidence,
      # so they go onto the branch where a reviewer can read them next to the
      # code. `render.log` carries one `preview:` line per shot with the
      # world-space box and diagonal of the quads that were submitted.
      - name: Commit the frames and the measured sizes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p Findings/effect-preview
          if [ -f target/effect-preview/render.log ]; then
            cp target/effect-preview/render.log Findings/effect-preview/
          fi
          find target/effect-preview -name '*.png' -size -2M -exec cp {} Findings/effect-preview/ \;
          ls -l Findings/effect-preview | head -40
          git config user.name "effect preview"
          git config user.email "preview@users.noreply.github.com"
          git add Findings/effect-preview
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "Effect preview frames [skip ci]"
          git push || (git pull --rebase && git push)

      - name: Keep the frames and the measured sizes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effect-preview
          path: target/effect-preview
          if-no-files-found: warn
