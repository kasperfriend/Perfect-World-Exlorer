name: CI diagnostics (temporary)
on:
  push:
    branches: [arena/bdae8dca-perfect-world-exlorer]
permissions:
  contents: read
  pull-requests: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Collect fmt diff
        run: |
          set +e
          cargo fmt --all -- --check > /tmp/fmt.txt 2>&1
          echo "fmt_exit=$?" > /tmp/status.txt
          {
            echo 'CI diagnostics for '"$GITHUB_SHA"
            echo '```'
            cat /tmp/status.txt
            head -c 20000 /tmp/fmt.txt
            echo '```'
          } > /tmp/body.md
          gh pr comment 3 --body-file /tmp/body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
