name: CI diagnostics (temporary)

# Temporary: the development sandbox has no Rust toolchain and cannot read
# Actions logs. This workflow applies rustfmt to the branch, runs the same
# checks as pr-checks.yml, and posts the captured output as pull-request
# comments so the failure text is readable through the GitHub API.
# Delete once the branch is green.

on:
  push:
    branches: [arena/bdae8dca-perfect-world-exlorer]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  diagnostics:
    name: Format and collect check output
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev
      - name: Format and push
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo fmt --all > /dev/null 2>&1
          git diff > /tmp/fmt.patch
          wc -c /tmp/fmt.patch > /tmp/fmt.size
          if [ -s /tmp/fmt.patch ]; then
            git config user.name "rustfmt"
            git config user.email "rustfmt@users.noreply.github.com"
            git commit -aqm "style: cargo fmt" && git push
            echo "pushed=yes" >> /tmp/fmt.size
          else
            echo "pushed=clean" >> /tmp/fmt.size
          fi
      - name: Collect
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo check --locked --bins > /tmp/check.log 2>&1
          echo "check exit=$?" > /tmp/exit.log
          cargo test --locked --bin perfect-world-explorer --no-run > /tmp/testbuild.log 2>&1
          echo "testbuild exit=$?" >> /tmp/exit.log
          cargo test --locked --bin perfect-world-explorer > /tmp/viewer.log 2>&1
          echo "viewer exit=$?" >> /tmp/exit.log
          sh tools/check-phase1-core.sh > /tmp/core.log 2>&1
          echo "core exit=$?" >> /tmp/exit.log
      - name: Publish diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "CI diagnostics for \`$GITHUB_SHA\`."
            echo
            echo '```'
            cat /tmp/fmt.size
            cat /tmp/exit.log
            echo '### cargo check --bins: errors and unused warnings'
            grep -E "^(error|warning: unused)" -A 6 /tmp/check.log | head -c 5000
            echo
            echo '### viewer test failures'
            grep -E "(FAILED|^failures:|panicked|test result: FAILED)" -B 2 -A 10 /tmp/viewer.log | head -c 5000
            echo
            echo '### check-phase1-core.sh failures'
            grep -E "(FAILED|^failures:|^error|panicked|test result: FAILED)" -B 2 -A 10 /tmp/core.log | head -c 5000
            echo
            echo '### viewer test result line'
            grep -E "^test result" /tmp/viewer.log | tail -5
            echo '```'
          } > /tmp/body.md
          gh pr comment 3 --body-file /tmp/body.md
          if [ "$(grep -c 'pushed=yes' /tmp/fmt.size)" = "1" ]; then
            { echo "rustfmt applied and pushed as a commit on this branch."; } > /tmp/patch.md
          else
            { echo '```diff'; head -c 50000 /tmp/fmt.patch; echo '```'; } > /tmp/patch.md
          fi
          gh pr comment 3 --body-file /tmp/patch.md
