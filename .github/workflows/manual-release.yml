name: Manual Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New version tag, e.g. v0.1.0 or v0.1.0-beta.1'
        required: true
        type: string
      prerelease:
        description: 'Mark as a prerelease'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: manual-windows-release
  cancel-in-progress: false

jobs:
  checks:
    name: Check release source (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all binary targets
        run: cargo check --locked --bins
      - name: Run viewer unit tests
        run: cargo test --locked --bin perfect-world-explorer

  release:
    name: Build and publish Windows release
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw 'Use a version tag such as v0.1.0 or v0.1.0-beta.1.'
          }
          $found = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not query existing tags.' }
          if ($found) { throw "Tag $env:RELEASE_TAG already exists; choose a new one." }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc
      - name: Rebuild the embedded 32-bit SpeedTree bridge
        shell: msys2 {0}
        run: g++ -static -O2 -municode tools/speedtree/bake.cpp -o tools/speedtree/speedtree-bake.exe
      - uses: Swatinem/rust-cache@v2
      - name: Build standalone viewer
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin perfect-world-explorer
      - name: Stage release files and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/perfect-world-explorer.exe release/Perfect-World-Explorer.exe
          $hash = (Get-FileHash release/Perfect-World-Explorer.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Perfect-World-Explorer.exe" | Out-File -Encoding ascii release/SHA256SUMS.txt
      - name: Publish GitHub release at the selected commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $args = @('release', 'create', $env:RELEASE_TAG, 'release/Perfect-World-Explorer.exe', 'release/SHA256SUMS.txt', '--target', $env:GITHUB_SHA, '--title', "Perfect World Explorer $env:RELEASE_TAG", '--generate-notes')
          if ($env:PRERELEASE -eq 'true') { $args += '--prerelease' }
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
