name: Test report

# Review-only helper: this sandbox cannot read Actions logs (blob storage is not
# reachable), so the failing test text is republished as a check annotation,
# which the API does serve. Deleted before this branch is handed off.
on:
  push:
    branches: [arena/5b7c9c75-perfect-world-exlorer]

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests and shader regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev mesa-vulkan-drivers
      - name: Viewer unit tests
        run: |
          cargo test --locked --bin perfect-world-explorer > /tmp/t.log 2>&1
          rc=$?
          python3 - <<'PY'
          import sys
          log = open('/tmp/t.log', errors='replace').read().splitlines()
          picked = []
          for line in log:
              s = line.strip()
              if ('panicked at' in line or s.startswith('test result')
                      or s.startswith('---- ') or 'assertion' in line
                      or s.startswith('left:') or s.startswith('right:')
                      or s.startswith('failures:') or s.startswith('FAILED')
                      or 'failed' in s.lower() and 'test' in s.lower()):
                  picked.append(line)
          text = '\n'.join(picked) if picked else '\n'.join(log[-80:])
          text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print('::error title=viewer unit tests::' + text[:60000])
          sys.exit(0)
          PY
          tail -30 /tmp/t.log
          exit $rc
      - name: Baked scenery raster regression
        env:
          WGPU_BACKEND: vulkan
          XDG_RUNTIME_DIR: /tmp
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          cargo run --locked --bin bmd-sided-gpu-check > /tmp/g.log 2>&1
          rc=$?
          python3 - <<'PY'
          import sys
          log = open('/tmp/g.log', errors='replace').read().splitlines()
          picked = [l for l in log if 'panicked' in l or 'flip ' in l or 'assert' in l or 'error' in l.lower()]
          text = '\n'.join(picked) if picked else '\n'.join(log[-60:])
          text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print('::notice title=bmd-sided-gpu-check::' + text[:60000])
          sys.exit(0)
          PY
          tail -30 /tmp/g.log
          exit $rc
