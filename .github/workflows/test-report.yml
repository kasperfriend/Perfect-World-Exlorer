name: Test report

# Review-only helper. This sandbox cannot read Actions logs (blob storage is
# unreachable) and check annotations were not published, so a failing run
# publishes the failure text as the message of an empty commit, which the
# sandbox can read with a plain `git pull`. Deleted before handoff.
on:
  push:
    branches: [arena/5b7c9c75-perfect-world-exlorer]

permissions:
  contents: write

jobs:
  tests:
    name: Unit tests and shader regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev mesa-vulkan-drivers
      - name: Viewer unit tests
        run: |
          cargo test --locked --bin perfect-world-explorer > /tmp/t.log 2>&1
          rc=$?
          tail -40 /tmp/t.log
          if [ $rc -ne 0 ] && [ "$(git log -1 --format=%s)" != "ci: unit test failure report" ]; then
            python3 - <<'PY'
            log = open('/tmp/t.log', errors='replace').read().splitlines()
            picked = []
            for line in log:
                s = line.strip()
                if ('panicked at' in line or s.startswith('test result')
                        or s.startswith('---- ') or 'assertion' in line
                        or s.startswith('left:') or s.startswith('right:')
                        or s.startswith('failures:')):
                    picked.append(line)
            text = '\n'.join(picked) if picked else '\n'.join(log[-80:])
            open('/tmp/msg.txt', 'w').write(
                'ci: unit test failure report\n\n' + text[:20000] + '\n')
            PY
            git config user.name "test report"
            git config user.email "test@example.invalid"
            git commit --allow-empty -F /tmp/msg.txt
            git push
          fi
          exit $rc
      - name: Baked scenery raster regression
        env:
          WGPU_BACKEND: vulkan
          XDG_RUNTIME_DIR: /tmp
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          cargo run --locked --bin bmd-sided-gpu-check > /tmp/g.log 2>&1
          rc=$?
          tail -30 /tmp/g.log
          exit $rc
