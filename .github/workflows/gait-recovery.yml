name: Gait recovery dump

# Live World retarget evidence can only be read from the retail client
# files, which are too large to pass through the agent sandbox. This job
# downloads them on a runner, runs `tools/gait_report.py` and commits the
# resulting plain-text dump back to the branch it was dispatched from.
#
# Trigger it by pushing a change to `.github/gait-recovery-trigger.txt`,
# or from the Actions tab / `gh workflow run gait-recovery.yml --ref <branch>`.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/gait-recovery-trigger.txt"

permissions:
  contents: write

concurrency:
  group: gait-recovery
  cancel-in-progress: true

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the client models archive
        run: |
          set -euo pipefail
          mkdir -p client
          curl -fsSL --retry 3 --retry-delay 5 -o client/models.pck \
            "https://drive.usercontent.google.com/download?id=1Flsvj2gdhJjpUxzFKi8FYvcBb6GWE2i2&export=download&confirm=t"
          size=$(stat -c%s client/models.pck)
          echo "client/models.pck: $size bytes"
          if [ "$size" -lt 1000000 ]; then
            echo "::error::the Drive download returned a page, not the file"
            head -c 400 client/models.pck || true
            exit 1
          fi

      - name: Dump gait-retarget evidence
        run: |
          python3 tools/gait_report.py --models client/models.pck \
            --out Findings/recovery/gait-evidence.md
          wc -c Findings/recovery/gait-evidence.md

      - name: Commit the dump
        run: |
          set -euo pipefail
          git config user.name "gait recovery"
          git config user.email "recovery@users.noreply.github.com"
          git add Findings/recovery/gait-evidence.md
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "Gait recovery dump [skip ci]"
            # Another push may land while the runner works (a human edit or a
            # follow-up fix), which used to reject this push and throw the
            # whole dump away. Rebase onto whatever landed, then push.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
