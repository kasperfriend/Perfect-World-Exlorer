# Perfect World Explorer installed module package.
# The executable discovers this manifest beside Perfect-World-Explorer.exe.
format=1
id=populator
name=Populator
version=1.0.0
description=Draw the world population the game itself ships: the 515 client-placed NPCs of element\data\task_npc.data (1,057 of its 1,572 records are the server's to place and are not drawn at the map origin), each resolved to its NPC_ESSENCE template and drawn with that template's real rig from models.pck, at the authored world position and height. Each actor carries the template's own name overhead and plays the template's own idle animation, and every placement is resolved against the client's own BMD building hulls so an NPC authored onto a bridge deck, platform or interior floor stands there instead of on the terrain under the geometry. Spawn distance defaults to the client's own 420-unit scene window and is adjustable, together with an actor cap, the name distance and the building-floor support. Mobs load the real MONSTER_ESSENCE templates but stay unspawned because mob placement lives in the server's gamedata\npcgen.data, which the client does not ship; actors move only along real navigation paths and therefore stand still without server route data. Spawn and appear only: no combat, dialogue or interaction. The module owns its archives, caches and GPU draws, and leaves the core untouched when disabled.
