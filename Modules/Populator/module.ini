# Perfect World Explorer installed module package.
# The executable discovers this manifest beside Perfect-World-Explorer.exe.
format=1
id=populator
name=Populator
version=1.0.0
description=Draw the world population the game itself ships: the 515 client-placed NPCs of element\data\task_npc.data (1,057 of its 1,572 records are the server's to place and are not drawn at the map origin), each resolved to its NPC_ESSENCE template and drawn with that template's real rig from models.pck, at the authored world position and height. Each actor carries the template's own name overhead and plays its rig's own idle animation (the client's 站立 combined action, falling back to its 休闲 action exactly where the client does, else the ordinary clip that names, else the rig's own 待机/站立/休闲/idle clip); the settings line reports how many drawn actors are actually moving, because the drawn pose is fingerprinted each frame instead of trusting the schedule. The labels use the family and point size the client's own Configs\\fonts.txt names for player and NPC overhead text, are fixed-size like the client's, and disappear when terrain or a building hull stands between them and the camera. Every placement is resolved against the client's own BMD building hulls so an NPC authored onto a bridge deck, platform or interior floor stands there instead of on the terrain under the geometry, and against the upward-facing top of models that ship no hull so a prop's NPC stands on the prop. The same hulls test whether the actor's own box is inside a wall: a placement authored into geometry drops to the ground under a solid plate it was lifted onto, or moves to the nearest free spot within 2.5 units that keeps its height, and one with nowhere to go keeps its column and is counted under in walls. Off-screen actors are not posed or uploaded, a pose is evaluated once per frame however many passes the host draws, and rig decompression stops once a frame has spent 4 ms on it. Spawn distance defaults to the client's own 420-unit scene window and is adjustable, together with an actor cap, the name distance and the building-floor support. Mobs load the real MONSTER_ESSENCE templates but stay unspawned because mob placement lives in the server's gamedata\npcgen.data, which the client does not ship; actors move only along real navigation paths and therefore stand still without server route data. Spawn and appear only: no combat, dialogue or interaction. The module owns its archives, caches and GPU draws, and leaves the core untouched when disabled.
