# Perfect World Explorer installed module package.
# The executable discovers this manifest beside Perfect-World-Explorer.exe.
format=1
id=populator
name=Populator
version=1.0.0
description=Draw the world population the game itself ships: the 515 client-placed NPCs of element\data\task_npc.data (1,057 of its 1,572 records are the server's to place and are not drawn at the map origin), each resolved to its NPC_ESSENCE template and drawn with that template's real rig from models.pck, at the authored world position and height. Spawn distance defaults to the client's own 420-unit scene window and is adjustable, together with an actor cap, the templates' own idle animation and an optional camera-facing turn. Mobs load the real MONSTER_ESSENCE templates but stay unspawned because mob placement lives in the server's gamedata\npcgen.data, which the client does not ship; actors move only along real navigation paths and therefore stand still without server route data. Spawn and appear only: no combat, dialogue or interaction. The module owns its archives, caches and GPU draws, and leaves the core untouched when disabled.
