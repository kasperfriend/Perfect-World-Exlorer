name=Walker
version=1.0.0
description=Spawn a real, animated, clothed player character on the loaded terrain. The integrated Character Designer customizes and rebuilds the same Walker from native class/gender, body, face, equipment, and preset data. Includes an Explorer-selected authentic level-one preview loadout, source-backed run/jump/swim mechanics, mounting and flight, adjustable move speed and jump height, third-person view, and a bone-positioned first-person view. The preview loadout is not a recovered server grant table. Walker uses terrain and water support and leaves the core free-flight mode available when disabled.
