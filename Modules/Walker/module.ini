name=Walker
version=1.0.0
description=Spawn a real, animated, clothed player character on the loaded terrain. The integrated Character Designer customizes and rebuilds the same Walker from native class/gender, body, face, equipment, and preset data. Includes an Explorer-selected authentic level-one preview loadout, native Psychic orb attachment, source-backed run/jump/swim mechanics, mounting and flight, animation-driven EventType 101 movement sounds, adjustable move speed and jump height, third-person view, and a bone-positioned first-person view. Collision check uses native building/object and tree hulls; terrain and water support always remain enabled. The preview loadout is not a recovered server grant table. Walker leaves the core free-flight mode available when disabled.
