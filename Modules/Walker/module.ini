description=Spawn a real, animated, clothed player character and walk on the loaded terrain. The integrated Character Designer customizes and rebuilds the same Walker from native class/gender, body, face, equipment, and preset data. Includes native starting armor, source-backed run/jump mechanics, adjustable move speed and jump height, third-person view, and a bone-positioned first-person view. Walker uses terrain support, not flight; it does not change the core camera, world, interface, or persisted settings.
